<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Mặc định vừa khít màn hình (initial-scale=1) nhưng cho phép người dùng tự co dãn tới 5x -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>LoLo - Nền tảng ERP đa doanh nghiệp</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d47c9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoLo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/lolo-icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/lolo-icon-192.png" />

    <!-- Orientation: cho phép quay ngang trên mobile, header tự điều chỉnh notch -->
    <style>
      /* Khi xoay ngang trên mobile: giảm padding-top header (notch ở cạnh) */
      @media (orientation: landscape) and (max-width: 932px) {
        #top_header_bar {
          padding-top: 8px !important;
          padding-bottom: 8px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
