<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Cố định trang: KHÔNG cho phóng to/thu nhỏ (như app). viewport-fit=cover để nền phủ tới mép tai thỏ; nội dung tự né bằng env(safe-area-inset-*) (xem shell.css).
         iOS Safari bỏ qua user-scalable=no với cử chỉ 2 ngón nên còn chặn thêm sự kiện gesture* ở script cuối <body> + touch-action trong shell.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LoLo - Nền tảng ERP đa doanh nghiệp</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d47c9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoLo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/lolo-icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/lolo-icon-192.png" />

    <!-- Orientation: cho phép quay ngang trên mobile, header tự điều chỉnh notch -->
    <style>
      /* Khi xoay ngang trên mobile: giảm padding-top header (notch ở cạnh) */
      @media (orientation: landscape) and (max-width: 932px) {
        #top_header_bar {
          padding-top: 8px !important;
          padding-bottom: 8px !important;
        }
      }
    </style>
    <!-- MÀN CHỜ SỚM: hiện ngay lúc trình duyệt tải trang, TRƯỚC khi JavaScript chạy (tránh trắng màn hình). React thay thế nội dung #root khi chạy;
         màn chờ của ứng dụng (src/components/LoadingScreen.tsx) dùng cùng kiểu dáng .lolo-splash* nên chuyển cảnh không chớp. Bản sao CSS tối thiểu — giữ giống src/index.css. -->
    <style>
      .lolo-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;color:#ffffff;background:radial-gradient(120% 90% at 50% 20%,#2a7bff 0%,#0d47c9 55%,#0a3aa8 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .lolo-splash-box{width:min(260px,76vw);display:flex;flex-direction:column;align-items:center;gap:22px}
      .lolo-splash-logo{width:96px;height:96px;border-radius:22%;display:block;box-shadow:0 14px 34px rgba(5,25,90,.45);animation:lolo-breathe 2.6s ease-in-out infinite}
      .lolo-splash-bar{position:relative;width:100%;height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
      .lolo-splash-bar:before{content:"";position:absolute;top:0;bottom:0;width:42%;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,0),#ffffff,rgba(255,255,255,0));animation:lolo-slide 1.35s ease-in-out infinite}
      .lolo-splash-msg{position:relative;height:18px;width:100%;text-align:center;font-size:13px;font-weight:600;letter-spacing:.2px;color:#ffffff}
      .lolo-splash-msg>span{position:absolute;inset:0}
      .lolo-splash-msg>span.boot{opacity:0;animation:lolo-boot-msg 9s infinite}
      .lolo-splash-msg>span.boot:nth-child(2){animation-delay:3s}.lolo-splash-msg>span.boot:nth-child(3){animation-delay:6s}
      .lolo-splash-foot{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.7);font-size:11.5px}
      @keyframes lolo-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      @keyframes lolo-slide{0%{left:-45%}100%{left:103%}}
      @keyframes lolo-boot-msg{0%{opacity:0;transform:translateY(6px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-6px)}}
      @media (prefers-reduced-motion:reduce){.lolo-splash-logo,.lolo-splash-bar:before,.lolo-splash-msg>span.boot{animation:none!important}.lolo-splash-msg>span.boot:first-child{opacity:1}}
    </style>
  </head>
  <body>
    <div id="root"><div class="lolo-splash" role="status" aria-label="Đang tải" id="boot-splash">
      <div class="lolo-splash-box">
        <img class="lolo-splash-logo" src="/lolo-icon-192.png" alt="LoLo" width="96" height="96">
        <div class="lolo-splash-bar"></div>
        <div class="lolo-splash-msg" style="color:#ffffff"><span class="boot">Đang khởi động…</span><span class="boot">Đang kết nối máy chủ…</span><span class="boot">Đang tải dữ liệu công ty…</span></div>
      </div>
      <div class="lolo-splash-foot">Nền tảng ERP đa doanh nghiệp</div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
      <script>
      /* ios-viewport-nudge */
      // iPhone mở ứng dụng từ Màn hình chính: vùng hiển thị (và các lớp cố định như màn chờ, thanh menu dưới) có lúc NGẮN HƠN màn hình khoảng 80px — lộ một dải trắng ở đáy —
      // và chỉ trở lại bình thường sau khi người dùng VUỐT XUỐNG (một lần cuộn thật khiến iOS tính lại). Ở đây tự làm đúng việc đó ngay lúc khởi động:
      // tạo 2px cuộn được rồi cuộn 2px và về 0, gắn lại thẻ viewport, phát sự kiện resize; lặp vài lần trong ~4 giây đầu (và khi quay lại ứng dụng).
      // Chỉ chạy khi là ứng dụng đã cài ở Màn hình chính (standalone) — trình duyệt thường không bị ảnh hưởng.
      (function () {
        var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (!standalone) return;
        function nudge() {
          try {
            var de = document.documentElement, b = document.body;
            if (!de || !b) return;
            var m = document.querySelector('meta[name="viewport"]');
            if (m && m.parentNode) m.parentNode.replaceChild(m.cloneNode(true), m);
            var pd = de.style.minHeight, pb = b.style.minHeight;
            de.style.minHeight = 'calc(100% + 2px)'; b.style.minHeight = 'calc(100% + 2px)';
            window.scrollTo(0, 2); window.scrollTo(0, 0);
            de.style.minHeight = pd; b.style.minHeight = pb;
            window.dispatchEvent(new Event('resize'));
          } catch (e) { /* bỏ qua */ }
        }
        [0, 120, 400, 900, 1800, 3500].forEach(function (t) { setTimeout(nudge, t); });
        window.addEventListener('pageshow', nudge);
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') setTimeout(nudge, 100); });
      })();
    </script>
      <script>
      // Chặn phóng to bằng 2 ngón trên iOS Safari (gesturestart/change/end) — bổ trợ cho user-scalable=no
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
    </script>
</body>
</html>
