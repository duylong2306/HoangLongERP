<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Cố định trang: KHÔNG cho phóng to/thu nhỏ (như app). viewport-fit=cover để nền phủ tới mép tai thỏ; nội dung tự né bằng env(safe-area-inset-*) (xem shell.css).
         iOS Safari bỏ qua user-scalable=no với cử chỉ 2 ngón nên còn chặn thêm sự kiện gesture* ở script cuối <body> + touch-action trong shell.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LoLo - Nền tảng ERP đa doanh nghiệp</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d47c9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoLo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/lolo-icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/lolo-icon-192.png" />

    <!-- Orientation: cho phép quay ngang trên mobile, header tự điều chỉnh notch -->
    <style>
      /* Khi xoay ngang trên mobile: giảm padding-top header (notch ở cạnh) */
      @media (orientation: landscape) and (max-width: 932px) {
        #top_header_bar {
          padding-top: 8px !important;
          padding-bottom: 8px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
      <script>
      // Chặn phóng to bằng 2 ngón trên iOS Safari (gesturestart/change/end) — bổ trợ cho user-scalable=no
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
        document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
      });
    </script>
</body>
</html>
